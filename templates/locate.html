<style>
  html, body {
    margin: 0;
    padding: 0;
    width: {{ width }}px;
    height: {{ height }}px;
    background: #1c2026;
    overflow: hidden;
  }
  #map {
    position: relative;
    width: {{ width }}px;
    height: {{ height }}px;
    overflow: hidden;
    background: #1c2026;
  }
  /* 瓦片已由插件端下载并内联为 data URI，页面不再发网络请求，截图必定完整；
     缺失的瓦片用上一级瓦片放大补位，故分两层（parent 在下） */
  .tile {
    position: absolute;
    display: block;
    z-index: 2;
  }
  .tile.parent { z-index: 1; }
  /* 玩家标记：深色描边 + 光晕 + 中心白点，黄色路网上也能一眼看到 */
  .dot {
    position: absolute;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-sizing: border-box;
    border: 2px solid #08121e;
    z-index: 5;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.4), 0 0 14px 3px rgba(56, 189, 248, 0.95);
  }
  .dot::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 36%;
    height: 36%;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.95);
    transform: translate(-50%, -50%);
  }
  .dot.me {
    border-color: #ffffff;
    box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.55), 0 0 20px 6px rgba(34, 197, 94, 1);
  }
  .attr {
    position: absolute;
    right: 10px;
    bottom: 8px;
    font: 13px/1 "Microsoft YaHei", "PingFang SC", sans-serif;
    color: rgba(255, 255, 255, 0.35);
  }
</style>
<div id="map">
  {% for t in tiles %}<img class="tile{{ ' parent' if t.parent else '' }}" src="{{ t.src }}" style="left: {{ t.left }}px; top: {{ t.top }}px; width: {{ t.size }}px; height: {{ t.size }}px" alt="">{% endfor %}
  {% for m in markers %}<span class="dot{{ ' me' if m.me else '' }}" style="left: {{ m.x }}px; top: {{ m.y }}px; width: {{ m.size }}px; height: {{ m.size }}px; background: {{ m.color }}"></span>{% endfor %}
  <div class="attr">CNTIR 实时地图</div>
</div>
