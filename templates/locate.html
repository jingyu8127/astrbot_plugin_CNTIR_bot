<style>
  html, body {
    margin: 0;
    padding: 0;
    width: {{ width }}px;
    height: {{ height }}px;
    background: #1c2026;
    overflow: hidden;
  }
  #map {
    position: relative;
    width: {{ width }}px;
    height: {{ height }}px;
    overflow: hidden;
    background: #1c2026;
  }
  /* 瓦片已由插件端下载并内联为 data URI，页面不再发网络请求，截图必定完整 */
  .tile {
    position: absolute;
    width: 512px;
    height: 512px;
    display: block;
  }
  .dot {
    position: absolute;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.55);
  }
  .dot.me {
    box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.65), 0 0 10px rgba(87, 189, 0, 0.9);
  }
  .attr {
    position: absolute;
    right: 10px;
    bottom: 8px;
    font: 13px/1 "Microsoft YaHei", "PingFang SC", sans-serif;
    color: rgba(255, 255, 255, 0.35);
  }
</style>
<div id="map">
  {% for t in tiles %}<img class="tile" src="{{ t.src }}" style="left: {{ t.left }}px; top: {{ t.top }}px" alt="">{% endfor %}
  {% for m in markers %}<span class="dot{{ ' me' if m.me else '' }}" style="left: {{ m.x }}px; top: {{ m.y }}px; width: {{ m.size }}px; height: {{ m.size }}px; background: {{ m.color }}"></span>{% endfor %}
  <div class="attr">CNTIR 实时地图</div>
</div>
