<style>
  html, body { margin: 0; padding: 0; background: #0b1f3f; }
  body {
    width: 1000px;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC",
                 "Segoe UI", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  .card {
    box-sizing: border-box;
    width: 1000px;
    min-height: 320px;
    padding: 40px 44px 32px;
    background: linear-gradient(180deg, #0d2a5c 0%, #08192f 100%);
  }
  .head { display: flex; align-items: center; gap: 16px; }
  .dot { width: 10px; height: 44px; background: #3b82f6; border-radius: 5px; flex: none; }
  .title { font-size: 38px; font-weight: 700; color: #ffffff; letter-spacing: 1px; }
  .meta { margin-left: auto; font-size: 20px; color: #93b8ea; white-space: nowrap; }
  .divider { height: 2px; background: rgba(120, 170, 255, 0.35); margin: 20px 0 26px; }
  .content {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 28px;
    line-height: 1.85;
    color: #eaf2ff;
  }
  .foot { margin-top: 26px; font-size: 20px; color: #7fa6d9; text-align: right; }
</style>
<div class="card">
  <div class="head">
    <div class="dot"></div>
    <div class="title">{{ title }}</div>
    <div class="meta">{{ time }}</div>
  </div>
  <div class="divider"></div>
  <div class="content">{{ content }}</div>
  <div class="foot">数据来源：CNTIR</div>
</div>
